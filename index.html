<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Master</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="hdr"><b>3D <span class="g">MASTER</span></b><span id="hdrDate"></span></div>



  <!-- ပင်မ -->
  <section class="sec" id="sec-home">
  <div class="sessbar">
    <select id="sessSel"></select>
    <button class="sbtn" id="newSessBtn">ပွဲစဉ် အသစ်</button>
  </div>
    <div class="grid2">
      <div class="tile gold" data-go="entry">ထိုးကွက် တင်</div>
      <div class="tile" data-go="ledger">လယ်ဂျာ</div>
      <div class="tile" data-go="win">ပေါက်သီး</div>
      <div class="tile" data-go="daily">နေ့ချုပ်</div>
      <div class="tile" data-go="voucher">ဘောက်ချာ</div>
      <div class="tile" data-go="over">အကျွံ</div>
      <div class="tile" data-go="people">လူစာရင်း</div>
      <div class="tile" data-go="settings">ဆက်တင်</div>
    </div>
    <div class="total"><span>တက်ငွေ</span><b id="homeTotal">0</b></div>
  </section>

  <!-- ထိုးကွက် တင် -->
  <section class="sec" id="sec-entry">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>ထိုးကွက် တင်</h2></div>
    <select class="inp" id="entryPerson"></select>
    <textarea class="ta board" id="board" placeholder="123@500"></textarea>
    <div class="boardbar"><span>Last: <b id="lastTotal">0</b></span><span><b id="boardCount">0</b> ကွက် · Total <b id="boardTotal">0</b></span></div>
    <div class="prev" id="preview" style="display:none"></div>
    <div class="bad" id="badbox" style="display:none"></div>
    <div class="btnrow"><button class="btn gray" id="pasteBtn">Paste</button><button class="btn" id="saveBtn" disabled>သိမ်းမည်</button></div>
    <div class="status" id="entryStatus"></div>
  </section>

  <!-- လယ်ဂျာ -->
  <section class="sec" id="sec-ledger">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>လယ်ဂျာ</h2></div>
    <div class="statrow"><span>All Total <b id="ledTotal">0</b></span><span>အကွက် <b id="ledCount">0</b></span><button class="limitbtn" id="limitBtn">Limit 50,000</button></div>
    <div class="digits" id="digits"></div>
    <div class="ledger" id="ledgerGrid"></div>
  </section>

  <!-- ပေါက်သီး -->
  <section class="sec" id="sec-win">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>ပေါက်သီး</h2></div>
    <input class="inp" id="winInput" inputmode="numeric" maxlength="3" placeholder="000">
    <button class="btn" id="winBtn">သိမ်းမည်</button>
    <div class="status" id="winStatus"></div>
  </section>

  <!-- နေ့ချုပ် -->
  <section class="sec" id="sec-daily">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>နေ့ချုပ်</h2></div>
    <div id="dailyBox"></div>
  </section>

  <!-- ဘောက်ချာ -->
  <section class="sec" id="sec-voucher">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>ဘောက်ချာ</h2></div>
    <select class="inp" id="voucherPerson"></select>
    <div id="voucherBox"></div>
  </section>

  <!-- အကျွံ -->
  <section class="sec" id="sec-over">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>အကျွံ</h2></div>
    <div id="overBox"></div>
    <button class="btn" id="overCopyBtn" style="display:none">Copy အကျွံ</button>
    <textarea class="ta" id="overText" readonly style="display:none;margin-top:9px;min-height:80px"></textarea>
    <div class="status" id="overStatus"></div>
  </section>

  <!-- လူစာရင်း -->
  <section class="sec" id="sec-people">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>လူစာရင်း</h2></div>
    <input class="inp" id="pName" placeholder="အမည်">
    <select class="inp" id="pRole"><option value="bettor">ထိုးသား</option><option value="akan">အကန်ဒိုင်</option></select>
    <div class="frow">
      <input class="inp" id="pPayout" type="number" inputmode="numeric" placeholder="အဆ (500/550/450)">
      <input class="inp" id="pComm" type="number" inputmode="numeric" placeholder="ကော်% (25/15/10)">
    </div>
    <button class="btn" id="addPersonBtn">ထည့်မည်</button>
    <div class="status" id="peopleStatus"></div>
    <div id="peopleList" style="margin-top:10px"></div>
  </section>

  <!-- ဆက်တင် -->
  <section class="sec" id="sec-settings">
    <div class="backrow"><span class="back" data-go="home">&larr;</span><h2>ဆက်တင်</h2></div>
    <div class="setrow"><span>App Version</span><b>v7</b></div>
    <div class="setrow"><span>App Reset</span><button class="danger" id="resetBtn">အကုန် ရှင်း</button></div>
  </section>

</div>

<!-- Limit dialog -->
<div class="modal hidden" id="limitModal">
  <div class="mbox">
    <h3>Limit</h3>
    <input class="inp" id="limitInput" type="number" inputmode="numeric" style="margin-bottom:0">
    <div class="mrow">
      <button class="sbtn gray" id="limitCancel" style="flex:1">မလုပ်</button>
      <button class="sbtn" id="limitSave" style="flex:1">သိမ်းမည်</button>
    </div>
  </div>
</div>

<script src="parser3d.js"></script>
<script src="app.js"></script>
</body>
</html>
